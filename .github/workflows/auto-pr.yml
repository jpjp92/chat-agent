name: Auto PR dev to main

on:
  push:
    branches:
      - dev

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create PR if not exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list --base main --head dev --state open --json number --jq length)
          if [ "$EXISTING" -gt "0" ]; then
            echo "PR already exists. Skipping."
            exit 0
          fi

          DATE=$(date +'%Y-%m-%d')
          COMMITS=$(git log origin/main..HEAD --oneline | head -20 | sed 's/^/- /')

          printf '%s\n' "## Changes" "" "$COMMITS" "" "---" "Auto-generated by GitHub Actions" > /tmp/pr_body.md

          gh pr create \
            --base main \
            --head dev \
            --title "dev -> main: ${DATE}" \
            --body-file /tmp/pr_body.md

          echo "PR created."
